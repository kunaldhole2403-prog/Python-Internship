<!DOCTYPE html>
<html>

<head>
    <title>Django ChatBot</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .container {
            width: 90%;
            max-width: 700px;
            margin: 30px auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0, 0, 0, .2);
            overflow: hidden;
        }

        .header {
            background: #4CAF50;
            color: white;
            padding: 20px;
            font-size: 25px;
            font-weight: bold;
        }

        .chat-box {
            height: 450px;
            padding: 20px;
            overflow-y: auto;
            background: #fafafa;
        }

        .input-area {
            display: flex;
            padding: 15px;
            border-top: 1px solid #ddd;
        }

        .input-area input {
            flex: 1;
            padding: 12px;
            font-size: 16px;
        }

        .input-area button {
            margin-left: 10px;
            padding: 12px 20px;
            background: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }

        .bot-message {
            background: #e8f5e9;
            color: #222;
            width: fit-content;
            max-width: 70%;
            padding: 14px 18px;
            margin: 8px 0;
            border-radius: 18px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, .1);
            word-wrap: break-word;
        }

        .user-message {
            background: #4CAF50;
            color: white;
            width: fit-content;
            max-width: 70%;
            padding: 14px 18px;
            margin: 8px 0 8px auto;
            border-radius: 18px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, .1);
            word-wrap: break-word;
        }
    </style>

</head>

<body>

    <div class="container">

        <div class="header">
            🤖 Django ChatBot
        </div>

        <div class="chat-box" id="chat-box">

            <div class="bot-message">
                🤖 Hello! Welcome to Django ChatBot.
            </div>

            {% for chat in conversation %}
            <div class="user-message">
                {{chat.0}}
            </div>
            <div class="bot-message">
                {{chat.1}}
            </div>
            {% endfor %}
        </div>
        <form method="POST" id="chat-form">

            {% csrf_token %}

            <div class="input-area">

                <input type="text" id="message" name="message" placeholder="Type your message...">

                <button type="submit" name="action" value="send">
                    Send
                </button>
                <button type="button" id="clear-btn">
                    🗑 Clear Chat
                </button>

            </div>

        </form>

    </div>

    <script>
        const form = document.getElementById("chat-form");

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const csrfToken = document.querySelector(
                "[name=csrfmiddlewaretoken]"
            ).value;

            const messageInput = document.getElementById("message");
            const message = messageInput.value.trim();

            if (message === "") {
                alert("Please enter a message.");
                messageInput.focus();
                return;
            }
            const chatBox = document.getElementById("chat-box");

            const typing = document.createElement("div");
            typing.className = "bot-message";
            typing.textContent = "🤖 Typing...";

            chatBox.appendChild(typing);
            chatBox.scrollTop = chatBox.scrollHeight;

            fetch("/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": csrfToken
                },
                body: JSON.stringify({
                    action: "send",
                    message: message
                })
            })
                .then(function (response) {
                    return response.json();
                })

                .then(function (data) {
                    typing.remove()
                    const chatBox = document.getElementById("chat-box");

                    chatBox.innerHTML += `
                        <div class="user-message">
                            ${data.message}
                        </div>

                        <div class="bot-message">
                            ${data.reply}
                        </div>
                    `;

                    chatBox.scrollTop = chatBox.scrollHeight;

                    messageInput.value = "";
                    messageInput.focus();
                })
                .catch(function (error) {
                    console.log("Error:", error);
                });
        });
    </script>
    <script>
        const chatBox = document.getElementById("chat-box");

        chatBox.scrollTop = chatBox.scrollHeight;

    </script>
    <script>
        const messageInput = document.getElementById("message");

        messageInput.focus();
    </script>
    <script>
        const clearBtn = document.getElementById("clear-btn");

        clearBtn.addEventListener("click", function () {

            const csrfToken = document.querySelector(
                "[name=csrfmiddlewaretoken]"
            ).value;

            fetch("/", {
                method: "POST",
                headers: {
                    "Content-Type": "application/json",
                    "X-CSRFToken": csrfToken
                },
                body: JSON.stringify({
                    action: "clear"
                })
            })
                .then(function (response) {
                    return response.json();
                })
                .then(function (data) {

                    const chatBox = document.getElementById("chat-box");

                    chatBox.innerHTML = `
            <div class="bot-message">
                🤖 Hello! Welcome to Django ChatBot.
            </div>
        `;

                });

        });
    </script>
    <script>
        messageInput.addEventListener("keydown", function (event) {
            console.log(event.key);
        });
    </script>
</body>

</html>
